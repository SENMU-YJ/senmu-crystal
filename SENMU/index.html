    'https://npm.elemecdn.com/@supabase/supabase-js@2/dist/umd/supabase.js',

  function tryLoad(){
    if(idx>=urls.length)return;
    var s=document.createElement('script');
    s.src=urls[idx++];
    s.onload=function(){
      // SDK 加载成功，触发首次同步（_doFirstLoad 在后面定义）
      window._sbSDKLoaded=true;
      if(typeof _doFirstLoad==='function') setTimeout(_doFirstLoad,0);
    };
    s.onerror=function(){tryLoad();};
    document.head.appendChild(s);
  }
  tryLoad();
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --fg:#1a2e1a;--fmid:#2d4a2d;--fl:#4a7c59;--fpale:#8aab7a;
  --ivory:#faf6f0;--crystal:#2d5a2d;--bark:#5c3d2e;--gold:#c8a96e;
  --tdark:#2a2a2a;--tmid:#4a4a4a;--tlight:#7a7a7a;
  --btn:#3d7a3d;--btnhv:#2d5a2d;
}
html,body{width:100%;min-height:100dvh;font-family:'Noto Serif SC',serif;background:var(--ivory);color:var(--tdark);overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iOS Safari 安全区适配（刘海/底部 Home 条） */
body{padding-bottom:env(safe-area-inset-bottom,0px)}
/* 触控优化：移除 iOS 按钮默认样式 */
button,input,select,textarea{-webkit-appearance:none;appearance:none;font-family:'Noto Serif SC',serif}
/* 禁用 iOS 长按文字选择/弹出菜单（仅非交互区） */
img{-webkit-user-drag:none;user-drag:none;pointer-events:auto}
/* 触控高亮去除 */
*{-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--fl);border-radius:3px}

/* ---- 页面系统 ---- */
.pg{display:none;min-height:100vh;animation:fadeIn .35s ease}
.pg.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ---- 通用组件 ---- */
.btn{background:var(--btn);color:#fff;border:none;padding:11px 28px;border-radius:30px;font-family:'Noto Serif SC',serif;font-size:14px;cursor:pointer;letter-spacing:2px;transition:all .25s;box-shadow:0 3px 12px rgba(61,122,61,.28)}
.btn:hover{background:var(--btnhv);transform:translateY(-2px)}
.inp{border:1.5px solid rgba(138,171,122,.45);border-radius:11px;padding:9px 15px;font-family:'Noto Serif SC',serif;font-size:14px;background:rgba(255,255,255,.8);color:var(--tdark);outline:none;transition:border-color .25s;width:100%}
.inp:focus{border-color:var(--fl);box-shadow:0 0 0 3px rgba(74,124,89,.1)}
.card{background:rgba(255,255,255,.87);border-radius:14px;box-shadow:0 3px 16px rgba(74,124,89,.1);overflow:hidden;transition:transform .3s,box-shadow .3s;border:1px solid rgba(138,171,122,.18)}
.card:hover{transform:translateY(-3px);box-shadow:0 7px 24px rgba(74,124,89,.18)}

/* ---- 导航 ---- */
.nav{position:sticky;top:0;z-index:80;background:rgba(250,246,240,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(138,171,122,.22);display:flex;align-items:center;justify-content:space-between;padding:11px 20px;padding-top:calc(11px + env(safe-area-inset-top,0px))}
.nav-logo{font-family:'ZCOOL XiaoWei',serif;font-size:19px;color:var(--fg);letter-spacing:4px;cursor:pointer}
.nav-sub{font-size:9px;color:var(--fl);letter-spacing:3px;font-family:'Cinzel',serif}
.nav-back{background:none;border:none;color:var(--fmid);font-size:13px;cursor:pointer;font-family:'Noto Serif SC',serif;display:flex;align-items:center;gap:5px;padding:8px 0;min-height:44px}

/* ---- 分区标题 ---- */
.sec-hd{display:flex;align-items:center;justify-content:space-between;padding:0 18px 14px}
.sec-ttl{font-family:'ZCOOL XiaoWei',serif;font-size:21px;color:var(--fg);letter-spacing:3px;display:flex;align-items:center;gap:8px}
.sec-ttl::before{content:'';display:inline-block;width:3px;height:20px;background:var(--fl);border-radius:2px}
.more-btn{background:none;border:1.5px solid var(--fl);color:var(--fmid);padding:4px 13px;border-radius:18px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .22s;font-family:'Noto Serif SC',serif}
.more-btn:hover{background:var(--fl);color:#fff}

/* ---- 商品网格 ---- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:0 18px 18px}
@media(max-width:420px){.pgrid{grid-template-columns:repeat(2,1fr);gap:10px}}
.pcrd{position:relative;cursor:pointer}.pcrd .iw{width:100%;aspect-ratio:1;overflow:hidden;background:var(--crystal);position:relative}
.pcrd .iw img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.pcrd:hover .iw img{transform:scale(1.06)}
.pcrd .iw .pin-badge{position:absolute;top:6px;left:6px;pointer-events:none}
.pcrd .pi{padding:9px 11px}.pcrd .pn{font-size:13px;color:var(--tdark);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcrd .pd{font-size:11px;color:var(--tlight);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.5;margin-top:3px}

/* ---- 小型商品网格（啥都有小铺用，固定5列2行，卡片等比例缩放） ---- */
.pgrid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 18px 18px;overflow:hidden;max-height:calc(2 * ((100vw - 54px) / 5 * 1.55 + 38px))}
@media(min-width:600px){.pgrid5{max-height:calc(2 * ((100vw - 64px) / 5 * 1.55 + 40px))}}
/* ---- 新品小市集横向滑动容器 ---- */
.new-scroll-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;padding:0 14px 14px;scrollbar-width:none}
.new-scroll-wrap::-webkit-scrollbar{display:none}
.new-scroll-track{display:flex;flex-direction:row;gap:10px;width:max-content}
/* 新品卡片：比小卡片大，固定宽度，显示价格 */
.ncrd{flex:0 0 auto;width:calc((100vw - 56px) / 3.3);max-width:120px;cursor:pointer;border-radius:10px;overflow:hidden;background:rgba(45,90,45,.9);box-shadow:0 2px 8px rgba(0,0,0,.07);display:flex;flex-direction:column}
.ncrd-img{width:100%;aspect-ratio:1;overflow:hidden;position:relative}
.ncrd-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.ncrd:hover .ncrd-img img{transform:scale(1.06)}
.ncrd-info{padding:7px 8px 9px;display:flex;flex-direction:column;gap:3px}
.ncrd-name{font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.ncrd-price{font-size:13px;font-weight:600;color:#fff}
.ncrd-orig{font-size:11px;color:rgba(255,255,255,.7);text-decoration:line-through}
.pcrd-s{position:relative;cursor:pointer;border-radius:8px;overflow:hidden;background:var(--crystal);aspect-ratio:1}
.pcrd-s img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.pcrd-s:hover img{transform:scale(1.06)}
.pcrd-s .pin-badge{position:absolute;top:6px;left:6px;pointer-events:none}
.pcrd-s .pname{position:absolute;bottom:0;left:0;right:0;padding:5px 6px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}

/* ---- 轮播 ---- */
.csl-wrap{position:relative;overflow:hidden;border-radius:14px;margin:0 18px;background:var(--crystal);aspect-ratio:16/10.5;touch-action:pan-y}
.csl-track{display:flex;transition:transform .5s ease;height:100%}
.csl-slide{min-width:100%;height:100%;position:relative;overflow:hidden;cursor:pointer}
.csl-slide img{width:100%;height:100%;object-fit:contain}
.csl-cap{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;background:linear-gradient(transparent,rgba(26,46,26,.6));color:#fff;font-family:'ZCOOL XiaoWei',serif;font-size:15px;letter-spacing:2px}
.csl-dots{display:flex;justify-content:center;gap:7px;padding:9px}
.csl-dot{width:6px;height:6px;border-radius:50%;background:rgba(74,124,89,.28);cursor:pointer;border:none;transition:background .25s}
.csl-dot.on{background:var(--fl)}
.csl-arr{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.72);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--fmid);display:flex;align-items:center;justify-content:center;z-index:5;transition:background .25s}
.csl-arr:hover{background:rgba(255,255,255,.95)}
.csl-arr.prv{left:10px}.csl-arr.nxt{right:10px}

/* ---- 商品详情图片滑块 ---- */
.detail-csl{position:relative;overflow:hidden;background:var(--crystal);touch-action:pan-y}
.detail-track{display:flex;transition:transform .4s ease}
.ds{min-width:100%;width:100%;height:0;padding-bottom:100%;position:relative}
.ds img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
/* 轮播图详情页用16:7横向比例 */
.ds-banner{width:100%;aspect-ratio:16/7;position:relative;overflow:hidden;cursor:pointer}
.ds-banner img{width:100%;height:100%;object-fit:cover}

/* ---- 滑动手势 ---- */
.swipe-handler{overflow:hidden;touch-action:pan-y}
.swipe-container{display:flex;transition:transform .4s ease}

/* ---- 结缘询价按钮 ---- */
.inquiry-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 20px;background:var(--fg);color:#fff;border:none;border-radius:12px;font-family:'ZCOOL XiaoWei',serif;font-size:15px;letter-spacing:3px;cursor:pointer;transition:all .25s;margin-top:18px}
.inquiry-btn:hover{background:var(--fmid);transform:translateY(-2px);box-shadow:0 4px 16px rgba(26,46,26,.2)}
.inquiry-btn svg{flex-shrink:0}

/* ---- 详情页弹窗 ---- */
.detail-lightbox{display:none;position:fixed;inset:0;background:rgba(26,46,26,.7);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.detail-lightbox.on{display:flex}
.detail-lb-content{background:var(--ivory);border-radius:18px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;max-width:320px;width:92%;border:2px solid rgba(74,124,89,.3)}

/* ---- 搜索框 ---- */
.srch{margin:12px 18px 0;position:relative}
.srch input{padding-left:38px;padding-right:14px}
.srch .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fl);font-size:15px;pointer-events:none}
.srch .sb{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:var(--btn);color:#fff;border:none;border-radius:9px;padding:5px 13px;font-size:12px;cursor:pointer;font-family:'Noto Serif SC',serif}

/* ---- 弹窗 ---- */
.ov{display:none;position:fixed;inset:0;background:rgba(26,46,26,.5);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ov.on{display:flex}
.mb{background:var(--ivory);border-radius:18px;padding:28px 24px;max-width:340px;width:92%;position:relative;border:2px solid rgba(138,171,122,.38);box-shadow:0 18px 50px rgba(26,46,26,.28);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mb-lg{max-width:480px;width:95%}
.mc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mc-hd h3{font-family:'ZCOOL XiaoWei',serif;font-size:17px;color:var(--fg);letter-spacing:2px}
.mc-cls{background:none;border:none;font-size:22px;cursor:pointer;color:var(--tlight);line-height:1}


/* 商品管理弹窗卡片 */
.del-card{position:relative}

/* ---- 进入动画 ---- */
#anim-ov{display:none;position:fixed;inset:0;z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(to bottom,rgba(26,60,26,0) 0%,rgba(26,60,26,.75) 15%,rgba(26,60,26,.85) 50%,rgba(26,60,26,.75) 85%,rgba(26,60,26,0) 100%)}
#anim-ov.on{display:flex}
.anim-txt{font-family:'ZCOOL XiaoWei',serif;font-size:26px;color:rgba(255,255,255,0);letter-spacing:3px;text-align:center;transition:all 1.3s ease;display:block;width:100%;box-sizing:border-box}
.anim-txt.show{color:rgba(255,255,255,.95);letter-spacing:5px}
.anim-txt.hide{color:rgba(255,255,255,0)}
.anim-wrap{position:relative;width:280px;height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anim-hexagon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1}
.anim-txt-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;width:200px}

/* ---- 登入页 ---- */
#pg-login{background:var(--ivory)}
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;position:relative;z-index:2}
.login-title{font-family:'ZCOOL XiaoWei',serif;font-size:54px;color:var(--fg);letter-spacing:12px;font-weight:400;text-shadow:0 2px 8px rgba(74,124,89,.14);margin:14px 0 5px}
.login-sub{font-family:'Cinzel',serif;font-size:12px;color:var(--fl);letter-spacing:6px;margin-bottom:44px}
.motto-row{display:flex;align-items:center;gap:6px;margin-bottom:44px;max-width:360px;width:100%;padding:0 10px}
.motto-line{flex:0 0 20px;height:1px;background:rgba(138,171,122,.35)}
.motto-dot{width:6px;height:6px;border-radius:50%;border:1px solid rgba(138,171,122,.5);flex-shrink:0}
#motto-txt{font-size:13px;color:var(--tmid);line-height:2;text-align:center;letter-spacing:.5px;flex:1;min-width:0;padding:0 4px;word-break:break-all;overflow-wrap:break-word;white-space:normal}
.enter-btn{font-size:13px;padding:13px 32px;letter-spacing:2px}
.pine-corner{position:fixed;bottom:18px;left:18px;width:72px;height:100px;cursor:pointer;z-index:10;transition:transform .3s;filter:drop-shadow(0 2px 5px rgba(45,74,45,.28))}
.pine-corner:hover{transform:scale(1.1) translateY(-4px)}
.login-footer{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;font-size:10px;color:var(--tlight);letter-spacing:2px;z-index:5}
.login-footer .dot{color:var(--fl)}
/* 认证弹窗树枝 */
.auth-branch{position:absolute;pointer-events:none}

/* ---- 上传页 ---- */
.utree-btn{background:rgba(74,124,89,.1);border:1.5px solid rgba(74,124,89,.3);color:var(--fmid);padding:4px 11px;border-radius:14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .22s;font-family:'Noto Serif SC',serif}
.utree-btn:hover{background:var(--fl);color:#fff;border-color:var(--fl)}
.upload-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 18px 12px}
.ucard{cursor:pointer;border-radius:12px;overflow:hidden;border:1.5px solid rgba(138,171,122,.2);background:#fff;position:relative}
.ucard img{width:100%;aspect-ratio:1;object-fit:cover}
.ucard-name{padding:7px 9px;font-size:12px;color:var(--tmid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Noto Serif SC',serif}
/* 管理模式区域 - 默认隐藏按钮 */
.ucard-del,.ucard-hide,.ucard-pin{opacity:0;transition:opacity .15s}
/* 左上角 - 置顶按钮显示区 */
.ucard-zone-pin{position:absolute;top:0;left:0;width:50%;height:45px;z-index:5;cursor:pointer;display:none}
/* 左下角 - 隐藏按钮显示区 */
.ucard-zone-hide{position:absolute;bottom:0;left:0;width:50%;height:45px;z-index:5;cursor:pointer;display:none}
/* 右上角 - 删除按钮显示区 */
.ucard-zone-del{position:absolute;top:0;right:0;width:50%;height:45px;z-index:5;cursor:pointer;display:none}
/* 管理模式下显示区域 */
.ucard.in-manage .ucard-zone-hide,
.ucard.in-manage .ucard-zone-pin,
.ucard.in-manage .ucard-zone-del,
.del-card.in-manage .ucard-zone-hide,
.del-card.in-manage .ucard-zone-pin,
.del-card.in-manage .ucard-zone-del{display:block}
/* 按钮样式 - 放在区域内 */
.ucard-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(255,250,205,.95);color:#2d5a2d;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.ucard-zone-del:hover .ucard-del{opacity:1}
.ucard-del:hover{background:rgba(255,250,150,1);transform:scale(1.1)}
.ucard-hide{position:absolute;bottom:4px;left:4px;width:22px;height:22px;border-radius:50%;background:rgba(100,100,100,.65);color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.ucard-zone-hide:hover .ucard-hide{opacity:1}
.ucard-hide:hover{background:rgba(100,100,100,.85);transform:scale(1.1)}
.ucard-pin{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:rgba(100,100,100,.65);color:#fffACD;border:none;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.ucard-zone-pin:hover .ucard-pin{opacity:1}
.ucard-pin:hover{background:rgba(100,100,100,.85);transform:scale(1.1)}

/* 碎碎念管理按钮样式 */
.murmur-del,.murmur-pin{opacity:0;transition:opacity .15s;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%}
.murmur-del{width:22px;height:22px;background:rgba(100,100,100,.65);color:#fff;font-size:12px}
.murmur-del:hover{background:rgba(100,100,100,.85);transform:scale(1.1)}
.murmur-del.opaque,.murmur-pin.opaque{opacity:1}
.murmur-zone-del:hover .murmur-del,.murmur-zone-pin:hover .murmur-pin{opacity:1}
.murmur-pin{width:22px;height:22px;background:rgba(100,100,100,.65);color:#fffACD;font-size:10px}
.murmur-pin:hover{background:rgba(100,100,100,.85);transform:scale(1.1)}

/* ---- 图片横滚 ---- */

      _sbLog('Supabase SDK 未加载');
      return;
    }
    _supabase=window.supabase.createClient(SB_URL,SB_KEY);
    _sbReady=true;
    _sbLog('Supabase 初始化成功');
  }catch(e){
    console.error('[Supabase] 初始化失败:',e);
  }
}

// ================================================================
// Supabase Storage 图片上传
// ================================================================
async function uploadImageToSupabase(file, sec, origName){
  initSupabase();
  if(!_supabase||!_sbReady){
    _sbLog('uploadImageToSupabase: Supabase 未就绪');
    return null;
  }
  try{
    // 生成唯一文件名
    var timestamp = Date.now();
    var random = Math.random().toString(36).substr(2, 8);
    // 优先使用原始文件名扩展名，否则默认jpg
    var ext = 'jpg';
    if(origName && origName.includes('.')){
      ext = origName.split('.').pop().toLowerCase();
      if(ext.length > 4) ext = 'jpg'; // 扩展名太长的无效
    }
    var fileName = sec + '_' + timestamp + '_' + random + '.' + ext;
    
    // 上传到 Storage
    var result = await _supabase.storage
      .from(SB_BUCKET)
      .upload(fileName, file, {
        cacheControl: '3600',
        upsert: false
      });
    
    if(result.error){
      _sbLog('上传失败:', result.error.message);
      return null;
    }
    
    // 获取公开访问 URL
    var urlResult = _supabase.storage
      .from(SB_BUCKET)
      .getPublicUrl(fileName);
    
    var publicUrl = urlResult.publicUrl;
    // 如果 getPublicUrl 返回空，手动拼接 URL
    if(!publicUrl && SB_URL){
      publicUrl = SB_URL + '/storage/v1/object/public/' + SB_BUCKET + '/' + fileName;
    }
    
    _sbLog('图片上传成功:', publicUrl);
    return publicUrl;
  }catch(e){
    console.error('[Supabase] Storage 上传失败:', e);
    return null;
  }
}

async function fetchRemoteData(){
  initSupabase();
  if(!_supabase||!_sbReady){_sbLog('fetchRemoteData: Supabase 未就绪');return null;}
  try{
    var r=await _supabase.from('senmu').select('data_value').eq('data_key','senmu_v2').single();
    _sbLog('fetchRemoteData 结果',r);
    if(r.data&&r.data.data_value){
      _remoteVersion=r.data.data_value._version||0;
      return r.data.data_value;
    }
  }catch(e){
    console.error('[Supabase] fetchRemoteData 失败:',e);
  }
  return null;
}

async function syncToRemote(d){
  initSupabase();
  if(!_supabase||!_sbReady){_sbLog('syncToRemote: Supabase 未就绪');return;}
  if(_sbSyncing){_sbLog('syncToRemote: 正在同步中，跳过');return;}
  _sbSyncing=true;
  try{
    d._version=(d._version||0)+1;
    d._updatedAt=new Date().toISOString();
    _sbLog('syncToRemote: 开始同步，版本',d._version);
    var result=await _supabase.from('senmu').upsert({data_key:'senmu_v2',data_value:d},{onConflict:'data_key'});
    _sbLog('syncToRemote: 成功',result);
    _remoteVersion=d._version;
  }catch(e){
    console.error('[Supabase] syncToRemote 失败:',e);
      // 备用：直接用 fetch 写 REST API
      try{
        _sbLog('备用 REST 写入...');
        await fetch(SB_URL+'/rest/v1/senmu',{
          method:'POST',
          headers:{
            'apikey':SB_KEY,
            'Authorization':'Bearer '+SB_KEY,
            'Content-Type':'application/json',
            'Prefer':'resolution=merge-duplicates'
          },
          body:JSON.stringify({data_key:'senmu_v2',data_value:d})
        });
      }catch(e2){console.error('[Supabase] REST fallback 失败:',e2);}
  }
  _sbSyncing=false;
}

function resolveData(local,remote){
  if(!remote) return {d:local,fromRemote:false};
  var lv=local._version||0;
  var rv=remote._version||0;
  return rv>lv?{d:remote,fromRemote:true}:{d:local,fromRemote:false};
}

function getData(){
  initSupabase();
  if(_localCache&&_localCache.murmurs){initSecTitles(_localCache);return _localCache;}
  try{var s=localStorage.getItem('senmu_v2');if(s){var d=JSON.parse(s);initSecTitles(d);
    // 迁移碎碎念 images 字段
    if(d.murmurs&&d.murmurs.length>0){
      var changed=false;
      d.murmurs.forEach(function(m){
        if(m.images===undefined){
          m.images=m.image&&m.image.length?[m.image]:[];
          changed=true;
        }
        if(m.lastEdited===undefined){m.lastEdited=0;changed=true;}
        if(m.align===undefined){m.align='left';changed=true;}
      });
      if(changed)saveData(d);
    }
    // 迁移：构建统一的 moduleOrder（如果不存在）
    if(!d.moduleOrder){
      var fixed=d.fixedSecOrder||['carousel','newItems','bracelets','necklaces','misc'];
      var customIds=(d.customSections||[]).map(function(cs){return cs.id;});
      d.moduleOrder=fixed.concat(customIds);
      saveData(d);
    }
    _localCache=d;return d;
  }}catch(e){}
  var d=JSON.parse(JSON.stringify(DEFAULT_DATA));
  localStorage.setItem('senmu_v2',JSON.stringify(d));initSecTitles(d);_localCache=d;return d;
}

function saveData(d){
  localStorage.setItem('senmu_v2',JSON.stringify(d));
  _localCache=d;
  // 异步同步到云端（不阻塞主线程）
  syncToRemote(d).catch(function(e){console.error('[saveData] 同步异常:',e);});
}

// 手动触发同步（供控制台调用）
window.forceSync=function(){
  var d=getData();
  _sbLog('手动触发同步');
  syncToRemote(d).then(function(){_sbLog('手动同步完成');});
  return '同步已触发，请查看控制台';
};

// 首次加载：等 Supabase SDK 就绪后，拉取远程数据
function _doFirstLoad(){
  initSupabase();
  if(!_sbReady){
    _sbLog('firstLoad: SDK未就绪，等待中');
    return; // SDK加载完成后会由onload重新调用
  }
  _sbLog('firstLoad 开始，SDK已就绪');
  var s=localStorage.getItem('senmu_v2');
  var local=s?JSON.parse(s):null;
  _sbLog('本地数据版本:',local?local._version||0:'无');
  fetchRemoteData().then(function(remote){
    _sbLog('远程数据版本:',remote?remote._version||0:'无');
    if(!remote){
      // 远端无数据 → 把本地上传到云
      _sbLog('远端无数据，从本地上传');
      if(local)syncToRemote(local).catch(function(e){console.error('[firstLoad] 首次上传失败:',e);});
      return;
    }
    // 远端有数据 → 取版本更高的那个
    var lv=(local&&local._version)||0;
    var rv=remote._version||0;
    _sbLog('版本对比 本地:'+lv+' 远端:'+rv);
    if(rv>=lv){
      // 远端版本 >= 本地，用远端覆盖本地
      _localCache=remote;
      localStorage.setItem('senmu_v2',JSON.stringify(remote));
      initSecTitles(remote);
      _sbLog('已从远端更新本地数据');
      if(window._cur&&window._cur.page&&window._cur.page!=='login'){
        render(window._cur.page,window._cur.params||{});
      }
    } else {
      // 本地更新，把本地上传同步到云
      _sbLog('本地版本更新，上传到远端');
      syncToRemote(local).catch(function(e){console.error('[firstLoad] 同步本地到远端失败:',e);});
    }
  }).catch(function(e){console.error('[firstLoad] fetchRemoteData 异常:',e);});
}

// 获取处理好的商品列表（过滤隐藏 + 置顶优先 + 补齐空位）
function getProcessedItems(items,sec,maxCount){
  if(!items||!items.length) return [];
  var d=getData();
  var max=maxCount||4;
  
  // 过滤隐藏商品
  var visible=items.filter(function(p){return !isProductHidden(p.id,d);});
  
  // 置顶优先排序
  var pinned=[],unpinned=[];
  visible.forEach(function(p){
    if(isProductPinned(p.id,d)) pinned.push(p);
    else unpinned.push(p);
  });
  
  // 合并：置顶在前，其余按时间倒序
  unpinned.sort(function(a,b){return (parseInt(b.id.slice(2))||0)-(parseInt(a.id.slice(2))||0);});
  var sorted=pinned.concat(unpinned);
  
  // 截取展示数量
  var display=sorted.slice(0,max);
  
  // 补齐空位
  while(display.length<max){
    display.push({_empty:true,_sec:sec,_idx:display.length});
  }
  
  return display;
}

// ================================================================
// 路由
// ================================================================
var _stack=[];
var _cur=null;
var _historyHandled=false; // 防止 popstate 和按钮 goBack 双触发

function go(page,p){
  if(_cur)_stack.push(_cur);
  _cur={page:page,params:p||{}};
  // 同步浏览器 history，让手机侧滑/系统返回能触发 popstate
  if(page==='shop'){
    // 首页用 replaceState，不再往 history 堆
    history.replaceState({_senmu:true,stack:JSON.stringify(_stack),cur:JSON.stringify(_cur)},'','');
  } else {
    history.pushState({_senmu:true,stack:JSON.stringify(_stack),cur:JSON.stringify(_cur)},'','');
  }
  render(page,p||{});
  window.scrollTo({top:0,behavior:'smooth'});
}
function goBack(){
  if(_historyHandled){_historyHandled=false;return;}
  if(_stack.length){
    // 触发浏览器 back，让 history 保持同步；popstate 里再实际渲染
    history.back();
  } else {
    history.replaceState({_senmu:true,stack:'[]',cur:JSON.stringify({page:'shop',params:{}})},'','');
    _stack=[];_cur={page:'shop',params:{}};
    render('shop',{});
    window.scrollTo({top:0,behavior:'smooth'});
  }
}
// 监听浏览器返回（手机侧滑 / 系统返回键）
window.addEventListener('popstate',function(e){
  _historyHandled=true;
  if(_stack.length){
    var r=_stack.pop();
    _cur=r;
    render(r.page,r.params);
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    // 已在首页，推一条新 state 防止再次侧滑退出网页
    _cur={page:'shop',params:{}};
    render('shop',{});
    window.scrollTo({top:0,behavior:'smooth'});
    history.pushState({_senmu:true,stack:'[]',cur:JSON.stringify(_cur)},'','');
  }
});
// 停止轮播定时器
var _carouselTimer=null;
function stopCarousel(){
  if(_carouselTimer){
    clearInterval(_carouselTimer);
    _carouselTimer=null;
  }
}
function render(page,p){
  stopCarousel();
  var app=document.getElementById('app');
  if(page==='login'){app.innerHTML=loginHTML();afterLogin();}
  else if(page==='shop'){app.innerHTML=shopHTML();afterShop();}
  else if(page==='upload'){app.innerHTML=uploadHTML();}
  else if(page==='search'){app.innerHTML=searchHTML(p.kw||'');}
  else if(page==='more'){app.innerHTML=moreHTML(p.sec||'newItems');}
  else if(page==='detail'){app.innerHTML=detailHTML(p.sec,p.id);_didx=0;afterDetail();}
  else if(page==='murmur'){app.innerHTML=murmurHTML();}
  else if(page==='murmur-detail'){app.innerHTML=murmurDetailHTML(p.id);}
  else{app.innerHTML=loginHTML();afterLogin();}
}

    '钛晶','发晶','草莓晶','蔷薇辉石','红纹石','葡萄石','锂云母','舒俱来','坦桑石',
    '拉利玛','太阳石','彩虹月光石','摩根石','磷灰石','锆石','芙蓉石','芙蓉晶',
    '黑碧玺','碧玺','欧泊','珍珠','珊瑚','琥珀','蜜蜡','砗磲',
    // 金属
    '925银','纯银','镀金','18k金','14k金','铜','黄铜','青铜','不锈钢','钛金属',
    // 其他常见
    '镀金珠子','银珠','金珠','天然石','铜珠','磁铁','玻璃'
  ];
  var found=[];
  var lower=text;
  keywords.forEach(function(kw){
    if(lower.indexOf(kw)>=0&&found.indexOf(kw)<0)found.push(kw);
  });
  return found;
}

function startEnterAnim(){
  var ov=document.getElementById('anim-ov');
  var a1=document.getElementById('anim1');
  var a2=document.getElementById('anim2');
  ov.classList.add('on');
  a1.className='anim-txt'; a2.className='anim-txt';
  // 粒子
  for(var i=0;i<16;i++) addParticle(ov);
  setTimeout(function(){a1.classList.add('show');},350);
  setTimeout(function(){a2.classList.add('show');},1050);
  setTimeout(function(){a1.classList.remove('show');a1.classList.add('hide');a2.classList.remove('show');a2.classList.add('hide');ov.style.opacity='0';ov.style.transition='opacity .7s';},3200);
  setTimeout(function(){ov.classList.remove('on');ov.style.opacity='';ov.style.transition='';go('shop');},4000);
}
function addParticle(parent){
  var p=document.createElement('div');
  var c=['rgba(200,184,216,.85)','rgba(184,212,192,.85)','rgba(200,240,200,.9)','rgba(255,255,255,.65)'];
  var sz=3+Math.random()*6;
  p.style.cssText='position:absolute;width:'+sz+'px;height:'+sz+'px;background:'+c[Math.floor(Math.random()*4)]+';border-radius:50%;left:'+(8+Math.random()*84)+'%;top:'+(8+Math.random()*84)+'%;animation:pfloat '+(1.8+Math.random()*1.8)+'s ease-in-out '+(Math.random()*1.4)+'s forwards;';
  parent.appendChild(p);
  setTimeout(function(){p.remove();},4200);
}
// 粒子动画

var _ci=0,_ctimer=null;
function stopCarousel(){if(_ctimer){clearInterval(_ctimer);_ctimer=null;}}
function afterShop(){
  _ci=0;
  if(_ctimer)clearInterval(_ctimer);
  // 商品展示页轮播初始化
  var cslWrap=document.querySelector('.csl-wrap');
  var cslTrack=document.querySelector('.csl-track');
  var cslDots=document.querySelector('.csl-dots');
  if(cslWrap&&cslTrack){
    var slides=cslTrack.querySelectorAll('.csl-slide');
    if(slides.length>1){
      var cur=0;
      function showSlide(idx){
        cur=idx;
        cslTrack.style.transform='translateX(-'+(idx*100)+'%)';
        var dots=cslDots.querySelectorAll('.csl-dot');
        dots.forEach(function(d,i){d.className='csl-dot'+(i===idx?' on':'');});
      }
      function nextSlide(){
        showSlide((cur+1)%slides.length);
      }
      function prevSlide(){
        showSlide((cur-1+slides.length)%slides.length);
      }
      // 自动轮播
      _carouselTimer=setInterval(nextSlide,4500);
      // 点击控制
      cslDots.innerHTML=Array.from(slides).map(function(_,i){
        return '<button class="csl-dot'+(i===0?' on':'')+'" onclick="showSlide('+i+')"></button>';
      }).join('');
      var nxt=cslWrap.querySelector('.csl-arr.nxt');
      var prv=cslWrap.querySelector('.csl-arr.prv');
      if(nxt) nxt.onclick=nextSlide;
      if(prv) prv.onclick=prevSlide;
      // 触摸滑动手势
      var _cTsx=0,_cTcx=0,_cDrag=false,_cHoriz=false;
      cslWrap.addEventListener('touchstart',function(e){
        _cTsx=e.touches[0].clientX;
        _cTcx=_cTsx;
        _cDrag=false;_cHoriz=false;
      },{passive:true});
      cslWrap.addEventListener('touchmove',function(e){
        _cTcx=e.touches[0].clientX;
        var dx=Math.abs(_cTcx-_cTsx);
        if(!_cDrag&&dx>10){_cDrag=true;_cHoriz=true;}
        if(_cHoriz&&_cDrag){
          e.preventDefault();
          cslTrack.style.transition='none';
          cslTrack.style.transform='translateX(-'+(cur*100+((_cTsx-_cTcx)/cslWrap.offsetWidth)*100)+'%)';
        }
      },{passive:false});
      cslWrap.addEventListener('touchend',function(){
        if(_cHoriz&&_cDrag){
          var delta=_cTcx-_cTsx;
          var thresh=cslWrap.offsetWidth*0.15;
          cslTrack.style.transition='transform .5s ease';
          if(delta<-thresh) nextSlide();
          else if(delta>thresh) prevSlide();
          else showSlide(cur);
        }
        _cDrag=false;_cHoriz=false;
      },{passive:true});
    }
  }
  // 原有的定时轮播
  _ctimer=setInterval(function(){cNext('s');},4000);
}

// 获取商品排序用时间戳字符串：edit/modified优先，其次ID末尾时间戳
// edit是13位毫秒时间戳，补零到14位与ID时间戳同长度
function getSortTs(p){
  if(p.edit) return String(p.edit).padStart(14,'0');
  if(p.modified) return String(p.modified).padStart(14,'0');
  var m=(p.id||'').match(/(\d+)$/);
  return m?m[1]:'0';
}

// 按ID时间戳排序商品数组（新的在前），置顶优先
function sortByIdTime(arr){
  var d=getData();
  var pinned=[],unpinned=[];
  (arr||[]).forEach(function(p){if(d.pinnedProducts&&d.pinnedProducts.indexOf(p.id)>=0)pinned.push(p);else unpinned.push(p);});
  unpinned.sort(function(a,b){
    var ta=getSortTs(a),tb=getSortTs(b);
    if(tb.length!==ta.length)return tb.length-ta.length;
    if(tb>ta)return 1;if(tb<ta)return -1;return 0;
  });
  return pinned.concat(unpinned);
}

function getLatestProducts(d,limit){
  var all=[];
  var nonProductKeys={murmurs:1,customSections:1,hiddenProducts:1,pinnedProducts:1,fixedSecOrder:1,secTitles:1,hiddenSections:1,carousel:1,moduleOrder:1,sectionTitles:1,pinnedMurmurs:1,hiddenMurmurs:1,newItems:1};
  Object.keys(d).forEach(function(sec){
    if(nonProductKeys[sec]) return;
    if(Array.isArray(d[sec])){
      d[sec].forEach(function(p){
        // 跳过无标题的空占位数据
        if(!p.title && !p.caption) return;
        // 跳过隐藏商品
        if(isProductHidden(p.id,d)) return;
        all.push(Object.assign({},p,{_sec:sec}));
      });
    }
  });
  // 置顶优先，其余按ID末尾时间戳倒序（新的在前）
  var pinned=[],unpinned=[];
  all.forEach(function(p){if(d.pinnedProducts&&d.pinnedProducts.indexOf(p.id)>=0)pinned.push(p);else unpinned.push(p);});
  unpinned.sort(function(a,b){
    var ta=getSortTs(a),tb=getSortTs(b);
    if(tb.length!==ta.length)return tb.length-ta.length;
    if(tb>ta)return 1;if(tb<ta)return -1;return 0;
  });
  return pinned.concat(unpinned).slice(0,limit||10);
}

// 构建自定义模块HTML（展示页用）
function buildCustomSecHTML(d){
  var customSecs=d.customSections||[];
  if(!customSecs.length) return '';
  var html='';
  customSecs.forEach(function(cs){
    if(isSectionHidden(cs.id,d)) return;
    var secData=d[cs.id];
    if(!secData||!Array.isArray(secData)) return;
    var items=sortByIdTime(secData);
    if(!items.length) return;
    SEC_TITLES[cs.id]=cs.name;
    html+='<section style="margin-top:26px">'
      +'<div class="sec-hd"><div class="sec-ttl">'+cs.name+'</div>'
      +'<button class="more-btn" onclick="go(\'more\',{sec:\''+cs.id+'\'})">'+treeIconSVG()+'更多</button></div>'
      +'<div class="pgrid">'+productCardsHTMLWithPad(items,cs.id)+'</div>'
      +'</section>';
  });
  return html;
}

function shopCarouselHTML(items){
  var d=getData();
  var slides='',dots='';
  // 过滤隐藏商品
  var visibleItems=items.filter(function(it){return !isProductHidden(it.id,d);});
  // 置顶优先排序
  var pinned=[],unpinned=[];
  visibleItems.forEach(function(it){
    if(isProductPinned(it.id,d)) pinned.push(it);
    else unpinned.push(it);
  });
  unpinned.sort(function(a,b){return (parseInt(b.id.slice(2))||0)-(parseInt(a.id.slice(2))||0);});
  visibleItems=pinned.concat(unpinned);
  visibleItems.forEach(function(it,i){
    slides+='<div class="csl-slide" onclick="go(\'detail\',{sec:\'carousel\',id:\''+it.id+'\'})">'
      +'<img src="'+getImg(it,true,i)+'" alt="'+it.title+'" loading="lazy"/>'
      +'<div class="csl-cap">'+it.title+'</div>'
      +'</div>';
    dots+='<button class="csl-dot'+(i===0?' on':'')+'" onclick="cGo(\'s\','+i+')"></button>';
  });
  if(!visibleItems.length) return '';
  return '<div class="csl-wrap" id="csl-s">'
    +'<div class="csl-track" id="csl-s-track">'+slides+'</div>'
    +'<button class="csl-arr prv" onclick="cPrev(\'s\')">&#8249;</button>'
    +'<button class="csl-arr nxt" onclick="cNext(\'s\')">&#8250;</button>'
    +'</div>'
    +'<div class="csl-dots" id="csl-s-dots">'+dots+'</div>';
}

function cPrev(id){var d=getData();var n=d[id==='s'?'carousel':'carousel'].length;_ci=(_ci-1+n)%n;cUpdate(id,n);}
function cNext(id){var d=getData();var n=d[id==='s'?'carousel':'carousel'].length;_ci=(_ci+1)%n;cUpdate(id,n);}
function cGo(id,i){_ci=i;var d=getData();cUpdate(id,d[id==='s'?'carousel':'carousel'].length);}
function cUpdate(id,n){
  var t=document.getElementById('csl-s-track');
  if(t)t.style.transform='translateX(-'+(_ci*100)+'%)';
  var dots=document.querySelectorAll('#csl-s-dots .csl-dot');
  dots.forEach(function(d,i){d.classList.toggle('on',i===_ci);});
}

// 详情页滑动手势
var _touchStartX=0;
var _touchCurrentX=0;
var _touchStartY=0;
var _isDragging=false;
var _isHorizontalSwipe=false;
function dTouchStart(e){
  _touchStartX=e.touches[0].clientX;
  _touchStartY=e.touches[0].clientY;
  _touchCurrentX=_touchStartX;
  _isDragging=false;
  _isHorizontalSwipe=false;
}
function dTouchMove(e){
  _touchCurrentX=e.touches[0].clientX;
  var deltaX=Math.abs(_touchCurrentX-_touchStartX);
  var deltaY=Math.abs(e.touches[0].clientY-_touchStartY);
  // 判断滑动方向
  if(!_isDragging && deltaX>10){
    _isDragging=true;
    _isHorizontalSwipe=true;
  }
  if(_isHorizontalSwipe && _isDragging){
    e.preventDefault();
    var t=document.getElementById('d-track');
    if(t){
      var percent=_didx*100;
      var offset=((_touchCurrentX-_touchStartX)/window.innerWidth)*100;
      t.style.transition='none';
      t.style.transform='translateX(-'+(percent-offset)+'%)';
    }
  }
}
function dTouchEnd(e){
  if(_isHorizontalSwipe && _isDragging){
    var deltaX=_touchCurrentX-_touchStartX;
    var threshold=window.innerWidth*0.15; // 滑动超过15%宽度触发切换
    if(deltaX<-threshold){
      dNext();
    } else if(deltaX>threshold){
      dPrev();
    } else {
      dUpd(); // 回弹
    }
  }
  _isDragging=false;
  _isHorizontalSwipe=false;
  var t=document.getElementById('d-track');
  if(t)t.style.transition='transform .4s ease';
}

function uploadInquiryQR(input){
  var file=input.files&&input.files[0];
  if(!file){return;}
  toast('正在上传二维码... 🌿');
  compressImage(file, 800, 800, 0.9, async function(dataUrl, blob, origFile){
    var imageUrl = await uploadImageToSupabase(blob, 'qr', origFile ? origFile.name : file.name);
    if(imageUrl){
      var d=getData();
      d.inquiryQR=imageUrl;
      saveData(d);
      toast('二维码已更新 🌿');
      render('upload',{});
    } else {
      toast('上传失败，请重试');
    }
  });
}
function removeInquiryQR(){
  var d=getData();
  d.inquiryQR='';
  saveData(d);
  toast('二维码已删除');
  render('upload',{});
}

// 删除商品相关变量
var _delSec = null;
var _delId = null;

// 删除商品 - 点击后弹出确认
function delProd(sec, id){
  var d = getData();
  var items = d[sec] || [];
  var target = null;
  for(var i=0; i<items.length; i++){
    if(items[i].id == id){ target = items[i]; break; }
  }
  if(!target){ alert('找不到该商品'); return; }
  _delSec = sec;
  _delId = id;
  document.getElementById('del-confirm-msg').innerHTML = '确定要删除「<b>' + escapeHtml(target.title) + '</b>」吗？<br><span style="color:#c44;font-size:11px">此操作不可恢复</span>';
  document.getElementById('del-confirm-ov').classList.add('on');
}
function escapeHtml(t){
  return (t || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function cancelDel(){
  _delSec = null;
  _delId = null;
  document.getElementById('del-confirm-ov').classList.remove('on');
}
function confirmDel(){
  if(!_delSec || !_delId) return;
  var d = getData();
  var items = d[_delSec] || [];
  d[_delSec] = items.filter(function(x){ return x.id != _delId; });
  saveData(d);
  document.getElementById('del-confirm-ov').classList.remove('on');

      +'<div style="display:flex;gap:8px">'

      +'<button class="btn" style="flex:1;font-size:12px;padding:8px" '+(modIdx>=modOrder.length-1?'disabled style="flex:1;font-size:12px;padding:8px;background:#ddd;color:#999"':'onclick="moveModule('+modIdx+',1)"')+'>↓ 下移</button>'

    +'<div style="font-size:12px;color:var(--tlight);margin-bottom:8px">模块显示</div>'
    +'<button class="btn" style="width:100%;font-size:13px;padding:10px;'+(isHidden?'background:#4a7c59;color:#fff" onclick="toggleSectionVisibility(\''+sec+'\')">显示此模块':'background:#ddd;color:#333" onclick="toggleSectionVisibility(\''+sec+'\')">隐藏此模块')+'</button>'
    +(isHidden?'<div style="font-size:11px;color:var(--tlight);text-align:center;margin-top:6px">隐藏后该模块不会在展示页显示</div>':'')
    +'</div>';
  
  if(isCustom){
    html+='<div style="margin-bottom:16px;padding:12px;background:rgba(200,80,80,.08);border-radius:8px;border:1px solid rgba(200,80,80,.2)">'
      +'<div style="font-size:12px;color:var(--tlight);margin-bottom:8px">危险操作</div>'
      +'<button class="btn" style="width:100%;font-size:13px;background:rgba(200,80,80,.9)" onclick="deleteCustomSection(\''+sec+'\','+customIdx+')">删除此模块</button>'

function closeSecSettings(){document.getElementById('sec-settings-ov').classList.remove('on');}
function saveSecSettings(sec,customIdx){
  var newName=document.getElementById('sec-name-inp').value.trim();
  if(!newName){toast('请输入模块名称');return;}
  var d=getData();
  if(customIdx>=0){
    // 自定义模块：更新customSections
    d.customSections[customIdx].name=newName;
    SEC_TITLES[sec]=newName;
  } else {
    // 固定模块：保存到sectionTitles
    if(!d.sectionTitles)d.sectionTitles={};
    d.sectionTitles[sec]=newName;
    SEC_TITLES[sec]=newName;
  }
  saveData(d);
  closeSecSettings();
  toast('保存成功');
  render('upload',{});
}
function deleteCustomSection(sec,idx){
  _delCustomSec=sec;_delCustomIdx=idx;
  document.getElementById('del-confirm-msg').textContent='确定要删除此模块吗？模块内的所有商品也会被删除，此操作不可恢复。';
  document.getElementById('del-confirm-ov').classList.add('on');
}
function moveModule(idx,direction){
  var d=getData();
  var order=d.moduleOrder||[];
  if(order.length<2)return;
  var newIdx=idx+direction;
  if(newIdx<0||newIdx>=order.length)return;
  var temp=order[idx];
  order[idx]=order[newIdx];
  order[newIdx]=temp;
  d.moduleOrder=order;
  saveData(d);
  toast(direction<0?'已上移':'已下移');
  render('upload',{});
  closeSecSettings();
}
function toggleSectionVisibility(sec){
  var d=getData();
  if(!d.hiddenSections)d.hiddenSections=[];
  var idx=d.hiddenSections.indexOf(sec);
  if(idx>=0){
    d.hiddenSections.splice(idx,1);
    toast('模块已显示');
  } else {
    d.hiddenSections.push(sec);
    toast('模块已隐藏');
  }
  saveData(d);
  render('upload',{});
}
function confirmDelCustomSection(){
  var d=getData();
  delete d[_delCustomSec];
  d.customSections.splice(_delCustomIdx,1);
  if(d.moduleOrder){
    var mi=d.moduleOrder.indexOf(_delCustomSec);
    if(mi>=0)d.moduleOrder.splice(mi,1);
  }
  saveData(d);
  document.getElementById('del-confirm-ov').classList.remove('on');
  closeSecSettings();
  toast('模块已删除');
  render('upload',{});
}
var _origConfirmDel=window.confirmDel;
window.confirmDel=function(){

};

      +'<button class="del-img" onclick="delProdImg(\''+sec+'\',\''+p.id+'\','+i+')">×</button></div>';

    +'</div>'
    +'<label style="font-size:12px;color:var(--tmid);display:block;margin-bottom:5px">'+(isBanner?'标题':'商品名称')+'</label>'

function escapeHtmlAttr(s){return (s||'').replace(/"/g,'&quot;');}

function addNewProd(sec){

      renderProdEdit(sec,found);

function saveProdEdit(sec,id){

    if(items[i].id===id){

// 图片拖拽排序
function startImgDrag(sec,id,idx){
  _imgDragSec=sec;_imgDragId=id;_imgDragIdx=idx;_imgIsDragging=false;
}
function overImgDrag(e,toIdx){
  e.preventDefault();
  if(_imgDragIdx<0||toIdx===_imgDragIdx||toIdx<0)return;
  var d=getData(),items=d[_imgDragSec]||[];
  var p=null;for(var i=0;i<items.length;i++){if(items[i].id===_imgDragId){p=items[i];break;}}
  if(!p||!p.images)return;
  var imgs=p.images;
  if(_imgDragIdx>=imgs.length||toIdx>=imgs.length)return;
  var moved=imgs.splice(_imgDragIdx,1)[0];
  imgs.splice(toIdx,0,moved);
  _imgDragIdx=toIdx;
  // 实时更新UI
  var scroll=document.getElementById('eis-'+_imgDragId);
  if(scroll)renderProdEdit(_imgDragSec,p);
}
function endImgDrag(){
  if(_imgDragIdx<0)return;
  var d=getData(),items=d[_imgDragSec]||[];
  var p=null;for(var i=0;i<items.length;i++){if(items[i].id===_imgDragId){p=items[i];break;}}
  if(p)saveData(d);
  _imgDragSec=null;_imgDragId=null;_imgDragIdx=-1;
}
// 长按开始拖拽（移动端）
function startImgLongPress(sec,id,idx){
  _imgLongPressTimer=setTimeout(function(){
    _imgIsDragging=true;
    toast('拖动图片到目标位置',1500);
    startImgDrag(sec,id,idx);
    // 给所有 thumb 添加视觉反馈
    var scroll=document.getElementById('eis-'+id);
    if(scroll)scroll.querySelectorAll('.img-thumb').forEach(function(el,ni){
      el.addEventListener('touchmove',function(e2){
        e2.preventDefault();
        var touch=e2.touches[0];
        var target=document.elementFromPoint(touch.clientX,touch.clientY);
        var targetThumb=target&&target.closest?target.closest('.img-thumb'):null;
        if(targetThumb){
          var ni2=parseInt(targetThumb.dataset.idx||targetThumb.dataset.i||-1);
          if(ni2>=0)overImgDrag(e2,ni2);
        }
      },{passive:false});
    });
  },500);
}
function cancelImgLongPress(){
  if(_imgLongPressTimer){clearTimeout(_imgLongPressTimer);_imgLongPressTimer=null;}
}
function delProdImg(sec,id,idx){
  var d=getData();
  var items=d[sec]||[];
  for(var i=0;i<items.length;i++){
    if(items[i].id===id){items[i].images.splice(idx,1);break;}
  }
  saveData(d);
  var p=null;
  for(var i=0;i<(d[sec]||[]).length;i++){if(d[sec][i].id===id){p=d[sec][i];break;}}
  if(p)renderProdEdit(sec,p);
}
function handleImgUpload(sec,id,input){
  var files=Array.from(input.files);
  if(!files.length)return;
  var d=getData();
  var p=null;
  var items=d[sec]||[];
  for(var i=0;i<items.length;i++){if(items[i].id===id){p=items[i];break;}}
  if(!p)return;
  var cur=(p.images||[]).filter(function(x){return x;}).length;
  var can=10-cur;
  if(can<=0){toast('最多10张');return;}
  var toProc=files.slice(0,can);
  var done=0;
  var total=toProc.length;
  // 轮播图1600px，商品图1200px
  var maxSize=sec==='carousel'?1600:1200;
  toast('正在上传图片... 🌿');
  toProc.forEach(function(file){
    compressImage(file, maxSize, maxSize, 0.85, async function(dataUrl, blob, origFile){
      // 只上传到 Supabase Storage，不再保存 base64 到 localStorage
      var imageUrl = await uploadImageToSupabase(blob, sec, origFile ? origFile.name : file.name);
      if(imageUrl){
        // 上传成功：保存 URL 到 images 数组
        if(!p.images)p.images=[];
        var ei=p.images.indexOf('');
        if(ei>=0)p.images[ei]=imageUrl;
        else p.images.push(imageUrl);
      } else {
        // 上传失败：显示提示（不保存 base64，避免 localStorage 超配额）
        toast('图片上传失败，请重试');
      }
      done++;
      if(done===total){
        saveData(d);
        renderProdEdit(sec,p);
        toast('已添加'+done+'张 🌿');
      }
    });
  });
}

      +'<option value="ZCOOL XiaoWei"'+(item.font==='ZCOOL XiaoWei'?' selected':'')+'>站酷小薇</option>'
      +'</select>'
      +'<select id="ms-'+item.id+'" class="inp" style="width:auto;flex:1;min-width:70px">'
      +'<option value="13px"'+(item.size==='13px'?' selected':'')+'>小</option>'
      +'<option value="15px"'+(item.size==='15px'?' selected':'')+'>中</option>'
      +'<option value="17px"'+(item.size==='17px'?' selected':'')+'>大</option>'
      +'<option value="20px"'+(item.size==='20px'?' selected':'')+'>特大</option>'
      +'</select>'
      +'<input type="color" id="mc-'+item.id+'" value="'+item.color+'" style="width:34px;height:34px;border:none;border-radius:7px;cursor:pointer;padding:0" title="文字颜色"/>'
      +'<button onclick="insertMurmurImg(\''+item.id+'\')" class="btn" style="font-size:12px;padding:6px 12px;background:#6a9c6a">+图片</button>'
      +'<button onclick="saveMurmurItem(\''+item.id+'\')" class="btn" style="font-size:12px;padding:6px 12px">保存</button>'
      +'<button onclick="showDelMurmurConfirm(\''+item.id+'\')" style="background:rgba(180,55,55,.75);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer">删除</button>'
      +'</div></div>';
  }).join('');
  document.getElementById('mur-ov-body').innerHTML=
    '<div class="mc-hd"><h3>碎碎念管理</h3><button class="mc-cls" onclick="closeMurmurEditor()">×</button></div>'
    +rows
    +'<button class="btn" style="width:100%;font-size:13px;margin-top:4px" onclick="addMurmur()">+ 新增碎碎念</button>';
}
function saveMurmurItem(murId){
  var d=getData();
  if(!d.murmurs)d.murmurs=[];
  var murmur=d.murmurs.find(function(m){return m.id===murId;});
  if(!murmur){toast('未找到该碎碎念');return;}
  murmur.title=document.getElementById('mtitle-'+murId).value;
  murmur.text=document.getElementById('mt-'+murId).value;
  murmur.align=document.getElementById('malign-'+murId).value;
  murmur.font=document.getElementById('mf-'+murId).value;
  murmur.size=document.getElementById('ms-'+murId).value;
  murmur.color=document.getElementById('mc-'+murId).value;
  murmur.lastEdited=Date.now(); // 记录编辑时间
  saveData(d);
  render('murmur',{});
  toast('碎碎念已保存 🌿');
}
function addMurmur(){
  var d=getData();
  if(!d.murmurs)d.murmurs=[];
  d.murmurs.push({id:'mu'+Date.now(),title:'',text:'在这里写下你的森木碎碎念…',color:'#3d7a3d',size:'15px',font:'Noto Serif SC',align:'left',images:[],lastEdited:Date.now()});
  saveData(d);
  renderMurmurEditor();
}
function delMurmur(murId){
  var d=getData();
  var idx=d.murmurs.findIndex(function(m){return m.id===murId;});
  if(idx>=0){
    d.murmurs.splice(idx,1);
    saveData(d);
  }
  renderMurmurEditor();
}
function showDelMurmurConfirm(murId){
  _delMurmurId = murId;
  document.getElementById('del-mur-msg').innerHTML = '确定要删除这条碎碎念吗？';
  document.getElementById('del-mur-ov').classList.add('on');
}
function cancelDelMurmur(){
  _delMurmurId = null;
  document.getElementById('del-mur-ov').classList.remove('on');
}
function confirmDelMurmur(){
  if(_delMurmurId === null) return;
  delMurmur(_delMurmurId);
  _delMurmurId = null;
  document.getElementById('del-mur-ov').classList.remove('on');
}

// 压缩图片并转为base64，同时返回Blob用于上传
// callback(dataUrl, blob, file)
function compressImage(file, maxWidth, maxHeight, quality, callback){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement('canvas');
      var width = img.width;
      var height = img.height;
      // 等比例缩放
      if(width > height){
        if(width > maxWidth){
          height = Math.round(height * maxWidth / width);
          width = maxWidth;
        }
      }else{
        if(height > maxHeight){
          width = Math.round(width * maxHeight / height);
          height = maxHeight;
        }
      }
      canvas.width = width;
      canvas.height = height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      var dataUrl = canvas.toDataURL('image/jpeg', quality);
      // 同时获取Blob用于上传
      canvas.toBlob(function(blob){
        callback(dataUrl, blob, file);
      }, 'image/jpeg', quality);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 插入碎碎念图片（支持多张，自动压缩并上传到 Supabase Storage）
var _currentMurmurImgId = null; // 当前要插入图片的碎碎念ID
function insertMurmurImg(murId){
  _currentMurmurImgId = murId;
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    toast('正在上传图片... 🌿');
    // 压缩图片：最大800px，质量80%
    compressImage(file, 800, 800, 0.8, async function(dataUrl, blob, origFile){
      // 只上传到 Supabase Storage，不再保存 base64 到 localStorage
      var imageUrl = await uploadImageToSupabase(blob, 'murmur', origFile ? origFile.name : file.name);
      var d = getData();
      var murmur = d.murmurs.find(function(m){return m.id === _currentMurmurImgId;});
      if(murmur){
        if(!murmur.images) murmur.images = [];
        if(imageUrl){
          murmur.images.push(imageUrl);
        } else {
          toast('图片上传失败，请重试');
        }
        murmur.lastEdited = Date.now();
        saveData(d);
        renderMurmurEditor();
        if(imageUrl) toast('图片已插入 ('+murmur.images.length+') 🌿');
      }
      _currentMurmurImgId = null;
    });
  };
  input.click();
}

// 删除碎碎念图片
function deleteMurmurImg(murId, imgIdx){
  var d = getData();
  var murmur = d.murmurs.find(function(m){return m.id === murId;});
  if(murmur){
    // 兼容旧格式
    if(murmur.images===undefined){
      if(murmur.image && murmur.image.length>0){
        murmur.images=[murmur.image];
      }else{
        murmur.images=[];
      }
    }
    if(murmur.images && murmur.images[imgIdx] !== undefined){
      murmur.images.splice(imgIdx, 1);
      murmur.lastEdited = Date.now();
      saveData(d);
      renderMurmurEditor();
      toast('图片已删除 🌿');
    }
  }
}

var _toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.opacity='1';
  if(_toastTimer)clearTimeout(_toastTimer);
  _toastTimer=setTimeout(function(){t.style.opacity='0';},2200);
}
